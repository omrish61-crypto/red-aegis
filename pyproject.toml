[project]
name = "intected"
version = "0.1.0"
description = "INTECTED — PentestDROR AI co-pilot: task tree, parsing, next-step reasoning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
intected = "intected.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intected*"]

[tool.setuptools.package-data]
intected = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
