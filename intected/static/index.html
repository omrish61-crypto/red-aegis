<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTECTED — PentestDROR Co-pilot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">◈</span>
      <h1>INTECTED</h1>
      <span class="tag">PentestDROR co-pilot</span>
    </div>
    <div class="header-right">
      <select id="mission-select" title="mission"></select>
      <span id="conn" class="pill">connecting…</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="process">Process</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="mission">Mission</button>
  </nav>

  <main>
    <!-- PROCESS -->
    <section id="view-process" class="view active">
      <div class="grid-2">
        <div class="card">
          <h2>Task Tree <span class="hint" id="task-count"></span></h2>
          <div id="task-tree" class="tree"></div>
        </div>
        <div class="card">
          <h2>Command Queue</h2>
          <table id="cmd-table">
            <thead><tr><th>#</th><th>state</th><th>command</th><th>task</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>Timeline <span class="hint">audit</span></h2>
        <ul id="audit-list" class="audit"></ul>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="view-results" class="view">
      <div class="card">
        <h2>Findings &amp; Facts <span class="hint" id="fact-count"></span></h2>
        <table id="fact-table">
          <thead><tr><th>id</th><th>tool</th><th>type</th><th>value</th><th>conf</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- MISSION -->
    <section id="view-mission" class="view">
      <div class="grid-2">
        <div class="card">
          <h2>Mission</h2>
          <dl id="mission-dl"></dl>
        </div>
        <div class="card">
          <h2>Stats</h2>
          <div id="stat-cards" class="stat-cards"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modal-title">Evidence</h3>
        <button id="modal-close">✕</button>
      </div>
      <p class="hash" id="modal-sha"></p>
      <pre id="modal-content"></pre>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
